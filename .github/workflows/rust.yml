name: Rust checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libx11-dev libwayland-dev libxkbcommon-dev pkg-config
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test core and asset pipeline
        run: cargo test -p game_core -p asset_pipeline
      - name: Check game executable
        run: cargo check -p game_app
